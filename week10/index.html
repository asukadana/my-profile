<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="mx-auto max-w-xl">
    <h1>GitHubユーザー情報表示ツール</h1>

    <div>
        <input id="username" type="text" placeholder="ユーザーユーザー名を入力">
        <button id="searchButton">探す</button>
    </div>
</div>    

<p id="message">wa</p>

<div id="userCard"></div>
    <div class="flex items-center gap-4">
        <img id="avatar_url" src="" alt="ユーザーのアバター">
        <div>
            <h2 id="name" class="text-2xl font-bold text-slate-800">wi</h2> 
            <p id="bio" class="mt-1 text-slate-600">wu</p> 
        </div>
        <div class="mt-6 rounded-lg bg-slate-100 p-4"> 
            <p class="text-slate-600"> フォロワー数 </p> 
            <p id="followers" class="text-2xl font-bold text-slate-800" ></p> 
        </div>
    </div>

</body>

<script>
const username =document.getElementById("username")
const searchButton =document.getElementById("searchButton")

const message = document.getElementById("message")
const userCard=document.getElementById("userCard")

const avatar_url=document.getElementById("avatar_url")
const name=document.getElementById("name")
const bio=document.getElementById("bio")
const followers=document.getElementById("followers")

searchButton.addEventListener("click",async function(){
    const usernameIp =username.value.trim();

    if(usernameIp ===""){
        message.textContent="ユーザー名を入力してください"
        
        return;
    }

    message.textContent="読み込み中・・・"

    try{
        const response= await fetch(`https://api.github.com/users/asukadana`);

        if(!response.ok){
            message.textContent="ユーザーが見つかりませんでした"
            return;
        }

        const data= await response.json();
        console.log(data);

        avatar_url.src= data.avatar_url; 
        name.textContent = data.name; 
        bio.textContent = data.bio; 
        followers.textContent = data.followers;

        message.textContent="";
    }catch(error){
        console.error(error); 
        message.textContent = "通信に失敗しました";
    }
});

</script>
