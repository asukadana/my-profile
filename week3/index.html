<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介カード</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-200 flex max-w-50 mx-auto items-center justify-center min-h-screen p-8">
    <span class="flex flex-col md:flex-row gap-6">
        <div class="shadow rounded bg-yellow-200 flex-1">
            <h2 class="font-bold p-3">のび太</h2>
            <p class="p-2">人の幸せを喜べる優しい心をもった少年</p>
        </div>
        <div class="shadow rounded bg-red-200 flex-1">
            <h2 class="font-bold p-3">しずか</h2>
            <p class="p-2">バイオリンの演奏が得意？？な女の子</p>
        </div>
        <div class="shadow rounded bg-green-200 flex-1">
            <h2 class="font-bold p-3">出来杉</h2>
            <p class="p-2">なんでもできる少年</p>
        </div>
    </span>
</body>
</html>
